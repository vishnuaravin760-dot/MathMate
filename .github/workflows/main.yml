name: Build MathMate APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o MathMate_Project.zip -d extracted

      - name: Check maths engine
        run: node extracted/MathMate/tests/engine.test.js

      - name: Build APK
        run: gradle -p extracted/MathMate assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MathMate-APK
          path: extracted/MathMate/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
